<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 暑假環島互動行程表 V8</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Noto Sans TC', sans-serif; background-color: #93c5fd; overflow: hidden; }
        .app-container { display: flex; height: 100vh; position: relative; width: 100vw; flex-direction: row; }
        .map-area { flex-grow: 1; position: relative; height: 100%; }
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background-color: #bfdbfe; }
        .leaflet-routing-container { display: none !important; }
        .top-nav { position: absolute; top: 20px; left: 20px; display: flex; gap: 8px; z-index: 1000; flex-wrap: wrap; }
        .nav-pill { background: white; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s; color: #1e293b; }
        .nav-pill.active { background: #111827; color: white; }
        .nav-pill.notes-btn { background: #fef08a; color: #854d0e; }
        .nav-pill.notes-btn.active { background: #ca8a04; color: white; }
        .nav-pill.chat-btn { background: #dcfce7; color: #166534; }
        .nav-pill.chat-btn.active { background: #22c55e; color: white; }
        .side-panel { width: 380px; background: white; height: calc(100vh - 40px); margin: 20px 20px 20px 0; border-radius: 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; z-index: 10; flex-shrink: 0; }
        .panel-content { padding: 24px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; }
        .day-label { font-size: 12px; color: #475569; margin-bottom: 8px; display: flex; align-items: center; }
        .day-date { font-weight: 700; color: #3b82f6; margin-left: 8px; font-size: 13px; background: #eff6ff; padding: 2px 8px; border-radius: 12px; }
        .route-title { font-size: 20px; font-weight: 700; color: #111827; margin: 0 0 12px 0; }
        .route-desc { font-size: 13px; color: #475569; line-height: 1.5; margin-bottom: 20px; }
        .time-section { margin-bottom: 24px; }
        .time-label { font-size: 16px; font-weight: 500; color: #111827; margin-bottom: 12px; }
        .place-card { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 16px; }
        .place-img-wrapper { width: 64px; height: 64px; flex-shrink: 0; }
        .place-img { width: 100%; height: 100%; border-radius: 10px; object-fit: cover; background: #e5e7eb; }
        .place-info { flex-grow: 1; }
        .place-time { font-size: 12px; color: #111827; margin-bottom: 2px; }
        .place-name { font-size: 15px; font-weight: 700; color: #111827; margin: 0; display: flex; align-items: center; gap: 4px; }
        .place-rating { font-size: 11px; color: #475569; }
        .place-desc { font-size: 11px; color: #6b7280; }
        .drive-time-line { margin: -8px 0 12px 30px; padding-left: 50px; border-left: 2px dashed #cbd5e1; height: 30px; display: flex; align-items: center; font-size: 11px; color: #64748b; }
        .notes-list { list-style: none; padding: 0; }
        .notes-list li { background: #f8fafc; margin-bottom: 12px; padding: 16px; border-radius: 12px; border-left: 4px solid #facc15; font-size: 14px; line-height: 1.6; color: #334155; }
        .notes-list li strong { color: #1e293b; display: block; margin-bottom: 4px; }
        .chat-container { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
        .chat-messages { flex-grow: 1; overflow-y: auto; margin-bottom: 16px; padding-right: 4px; }
        .msg-bubble { background: #f1f5f9; padding: 12px; border-radius: 12px; margin-bottom: 10px; font-size: 14px; }
        .msg-user { font-weight: 700; color: #3b82f6; font-size: 12px; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
        .msg-time { font-size: 10px; color: #94a3b8; margin-top: 4px; text-align: right; }
        .chat-input-area { display: flex; gap: 8px; border-top: 1px solid #e2e8f0; padding-top: 16px; flex-shrink: 0; }
        #nameInput { width: 60px; border: 1px solid #cbd5e1; padding: 10px; border-radius: 20px; font-size: 13px; outline: none; }
        #msgInput { flex-grow: 1; border: 1px solid #cbd5e1; padding: 10px 14px; border-radius: 20px; font-size: 14px; outline: none; }
        #sendBtn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500; }
        @media (max-width: 768px) { .app-container { flex-direction: column; } .map-area { height: 40vh; } .side-panel { width: 100%; height: 60vh; margin: 0; border-radius: 20px 20px 0 0; } }
    </style>
</head>
<body>
<div class="app-container">
    <div class="map-area"><div id="map"></div><div class="top-nav" id="navContainer"></div></div>
    <div class="side-panel"><div class="panel-content" id="panelContent"></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    const firebaseConfig = {
        apiKey: "AIzaSyCHb7meFSzo5GKF-bvVpKD-xcOv0htN3Cc",
        authDomain: "ytooty-travel-notes.firebaseapp.com",
        projectId: "ytooty-travel-notes",
        storageBucket: "ytooty-travel-notes.firebasestorage.app",
        messagingSenderId: "529794562163",
        appId: "1:529794562163:web:a144449ae423fc9e641206",
        measurementId: "G-3EG536CVNP",
        databaseURL: "https://ytooty-travel-notes-default-rtdb.firebaseio.com"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const itineraryData = {
        1: { date: "2026/07/03 (五)", title: "台北 ➔ 花蓮 ➔ 池上", desc: "第一天啟程！", sections: [ { label: "Morning", places: [ { time: "05:00", name: "台北松山車站", rating: "4.3 ★", desc: "出發走國5接蘇花", img: "https://placehold.co/100x100/bfdbfe/1d4ed8?text=Train", lat: 25.0498, lng: 121.5781 }, { driveTime: "約 2.5 小時", time: "08:30", name: "台泥DAKA園區", rating: "4.2 ★", desc: "休憩補給", img: "https://placehold.co/100x100/d9f99d/4d7c0f?text=DAKA", lat: 24.3090, lng: 121.7538 }, { driveTime: "約 1.5 小時", time: "10:30", name: "光榮博物館", rating: "4.5 ★", desc: "參觀", img: "https://placehold.co/100x100/fef08a/a16207?text=Museum", lat: 23.9782, lng: 121.6025 } ]}, { label: "Afternoon", places: [ { driveTime: "約 50 分鐘", time: "14:00", name: "富興小火車", rating: "4.6 ★", desc: "需確認營運", img: "https://placehold.co/100x100/fbcfe8/be185d?text=Train", lat: 23.6300, lng: 121.4320 }, { driveTime: "約 1.5 小時", time: "17:30", name: "悟饕池上飯包", rating: "4.1 ★", desc: "晚餐", img: "https://placehold.co/100x100/fed7aa/c2410c?text=Bento", lat: 23.1235, lng: 121.1965 } ]} ] },
        2: { date: "2026/07/04 (六)", title: "池上 ➔ 台東", desc: "東台灣自然美景。", sections: [ { label: "Morning", places: [ { time: "05:30", name: "鹿野高台", rating: "4.6 ★", desc: "熱氣球", lat: 22.9130, lng: 121.1205, img: "https://placehold.co/100x100/fecaca/b91c1c?text=Balloon" }, { driveTime: "約 20 分鐘", time: "10:00", name: "初鹿牧場", rating: "4.2 ★", desc: "親近自然", lat: 22.8468, lng: 121.0883, img: "https://placehold.co/100x100/bbf7d0/15803d?text=Farm" } ]}, { label: "Afternoon", places: [ { driveTime: "約 30 分鐘", time: "14:00", name: "史前文化博物館", rating: "4.5 ★", desc: "歷史探索", lat: 22.7600, lng: 121.0930, img: "https://placehold.co/100x100/e9d5ff/7e22ce?text=History" }, { driveTime: "約 40 分鐘", time: "16:30", name: "太麻里平交道", rating: "4.3 ★", desc: "櫻木花道", lat: 22.6186, lng: 121.0028, img: "https://placehold.co/100x100/bae6fd/0369a1?text=Crossing" } ]} ] },
        3: { date: "2026/07/05 (日)", title: "台東 ➔ 高雄", desc: "南迴公路海岸線。", sections: [ { label: "Morning", places: [ { time: "09:00", name: "多良車站", rating: "4.4 ★", desc: "美景車站", lat: 22.5085, lng: 120.9592, img: "https://placehold.co/100x100/99f6e4/0f766e?text=Ocean" }, { driveTime: "約 1.5 小時", time: "12:00", name: "佳珍海鮮餐廳", rating: "4.2 ★", desc: "午餐", lat: 22.4660, lng: 120.4440, img: "https://placehold.co/100x100/fecdd3/be123c?text=Seafood" } ]}, { label: "Afternoon", places: [ { driveTime: "約 1 小時", time: "14:30", name: "壽山動物園", rating: "4.4 ★", desc: "漫步", lat: 22.6395, lng: 120.2760, img: "https://placehold.co/100x100/fde047/854d0e?text=Zoo" }, { driveTime: "約 20 分鐘", time: "17:00", name: "龍虎塔", rating: "4.3 ★", desc: "蓮池潭", lat: 22.6800, lng: 120.2910, img: "https://placehold.co/100x100/c7d2fe/4338ca?text=Tower" } ]} ] },
        4: { date: "2026/07/06 (一)", title: "高雄 ➔ 台南", desc: "府城美食與古蹟。", sections: [ { label: "Morning", places: [ { time: "11:30", name: "蒸鮮腸粉", rating: "4.3 ★", desc: "港飲", lat: 22.6450, lng: 120.3020, img: "https://placehold.co/100x100/fef08a/a16207?text=Dimsum" } ]}, { label: "Afternoon", places: [ { driveTime: "約 50 分鐘", time: "14:00", name: "奇美博物館", rating: "4.8 ★", desc: "藝術體驗", lat: 22.9345, lng: 120.2260, img: "https://placehold.co/100x100/e2e8f0/475569?text=Museum" }, { driveTime: "約 25 分鐘", time: "16:00", name: "安平古堡", rating: "4.4 ★", desc: "古蹟探索", lat: 23.0016, lng: 120.1606, img: "https://placehold.co/100x100/fdba74/c2410c?text=Old+Street" } ]} ] },
        5: { date: "2026/07/07 (二)", title: "台南 ➔ 嘉義 ➔ 台中", desc: "嘉義祈福與台中之夜。", sections: [ { label: "Morning", places: [ { time: "09:30", name: "KHTOY旗艦館", rating: "4.8 ★", desc: "玩偶館", lat: 23.5350, lng: 120.4350, img: "https://placehold.co/100x100/fecdd3/be123c?text=KHTOY" } ]}, { label: "Afternoon", places: [ { driveTime: "約 50 分鐘", time: "12:30", name: "竹山紫南宮", rating: "4.7 ★", desc: "祈福", lat: 23.7788, lng: 120.7303, img: "https://placehold.co/100x100/fef08a/a16207?text=Temple" }, { driveTime: "約 1 小時", time: "17:00", name: "激旨燒肉", rating: "4.5 ★", desc: "晚餐", lat: 24.1790, lng: 120.6450, img: "https://placehold.co/100x100/fed7aa/c2410c?text=BBQ" } ]} ] },
        6: { date: "2026/07/08 (三)", title: "台中 ➔ 台北", desc: "返程溫暖的家。", sections: [ { label: "Morning", places: [ { time: "10:00", name: "自然科學博物館", rating: "4.7 ★", desc: "參觀", lat: 24.1533, lng: 120.6695, img: "https://placehold.co/100x100/e9d5ff/7e22ce?text=Science" } ]}, { label: "Afternoon", places: [ { driveTime: "約 2 小時", time: "16:00", name: "溫暖的家", rating: "5.0 ★", desc: "抵達台北", lat: 25.0498, lng: 121.5781, img: "https://placehold.co/100x100/bfdbfe/1d4ed8?text=Home" } ]} ] },
        notes: { title: "注意事項", desc: "旅途提醒：", items: [ { title: "車輛檢查", content: "確認油量胎壓。" }, { title: "預約提醒", content: "熱門景點建議預約。" } ] }
    };
    let map = L.map('map', { zoomControl: false }).setView([23.5, 121], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let currentLayerGroup = L.featureGroup().addTo(map);
    let routingControl = null;
    function initNav() {
        const nav = document.getElementById('navContainer');
        for (let i = 1; i <= 6; i++) {
            const btn = document.createElement('div');
            btn.className = `nav-pill ${i === 1 ? 'active' : ''}`;
            btn.innerText = `Day ${i}`;
            btn.onclick = () => { setActive(btn); renderDay(i); };
            nav.appendChild(btn);
        }
        const notesBtn = document.createElement('div');
        notesBtn.className = 'nav-pill notes-btn';
        notesBtn.innerText = '注意事項';
        notesBtn.onclick = () => { setActive(notesBtn); renderNotes(); };
        nav.appendChild(notesBtn);
        const chatBtn = document.createElement('div');
        chatBtn.className = 'nav-pill chat-btn';
        chatBtn.innerHTML = '<i class="fa-regular fa-comments"></i> 留言板';
        chatBtn.onclick = () => { setActive(chatBtn); renderChat(); };
        nav.appendChild(chatBtn);
    }
    function setActive(el) { document.querySelectorAll('.nav-pill').forEach(b => b.classList.remove('active')); el.classList.add('active'); }
    function clearMap() { currentLayerGroup.clearLayers(); if (routingControl) map.removeControl(routingControl); }
    function renderDay(day) {
        const data = itineraryData[day];
        let html = `<div class="day-label">DAY ${day} <span class="day-date">${data.date}</span></div><h1 class="route-title">${data.title}</h1><p class="route-desc">${data.desc}</p>`;
        const coords = [];
        data.sections.forEach(sec => {
            html += `<div class="time-section"><div class="time-label">${sec.label}</div>`;
            sec.places.forEach(p => {
                if (p.driveTime) html += `<div class="drive-time-line"><i class="fa-solid fa-car-side"></i> ${p.driveTime}</div>`;
                html += `<div class="place-card"><div class="place-img-wrapper"><img class="place-img" src="${p.img}"></div><div class="place-info"><div class="place-time">${p.time}</div><h3 class="place-name">${p.name}</h3><div class="place-rating">${p.rating}</div><div class="place-desc">${p.desc}</div></div></div>`;
                coords.push([p.lat, p.lng]);
            });
            html += `</div>`;
        });
        document.getElementById('panelContent').innerHTML = html;
        clearMap();
        if (coords.length > 1) { routingControl = L.Routing.control({ waypoints: coords.map(c => L.latLng(c[0], c[1])), createMarker: () => null, show: false, lineOptions: { styles: [{color: '#3b82f6', weight: 5}] } }).addTo(map); }
        coords.forEach((c, idx) => { L.marker(c, {icon: L.divIcon({ className: '', html: `<div style="background:#111827;color:white;width:20px;height:20px;border-radius:50%;text-align:center;line-height:20px;font-size:10px;border:2px solid white;">${idx+1}</div>` })}).addTo(currentLayerGroup); });
        if (coords.length > 0) map.fitBounds(L.latLngBounds(coords), { padding: [50, 50] });
    }
    function renderNotes() {
        const data = itineraryData.notes;
        let html = `<div class="day-label" style="color:#ca8a04;">IMPORTANT</div><h1 class="route-title">${data.title}</h1><ul class="notes-list">${data.items.map(i => `<li><strong>${i.title}</strong>${i.content}</li>`).join('')}</ul>`;
        document.getElementById('panelContent').innerHTML = html;
        clearMap(); map.setView([23.5, 121], 7);
    }
    function renderChat() {
        clearMap(); map.setView([23.5, 121], 7);
        let html = `<h1 class="route-title">互動留言板</h1><div class="chat-container"><div class="chat-messages" id="chatMsgs">連線中...</div><div class="chat-input-area"><input type="text" id="nameInput" placeholder="名字"><input type="text" id="msgInput" placeholder="訊息"><button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button></div></div>`;
        document.getElementById('panelContent').innerHTML = html;
        const msgsRef = ref(db, 'messages');
        onValue(msgsRef, (snapshot) => {
            const data = snapshot.val();
            const msgList = document.getElementById('chatMsgs');
            if (!msgList) return;
            msgList.innerHTML = '';
            for (let id in data) {
                const m = data[id];
                const d = m.timestamp ? new Date(m.timestamp) : new Date();
                msgList.innerHTML += `<div class="msg-bubble"><div class="msg-user">${m.user || '旅伴'}</div><div>${m.text}</div><div class="msg-time">${d.getHours()}:${d.getMinutes()}</div></div>`;
            }
            msgList.scrollTop = msgList.scrollHeight;
        });
        document.getElementById('sendBtn').onclick = () => {
            const name = document.getElementById('nameInput').value.trim();
            const text = document.getElementById('msgInput').value.trim();
            if (text) { push(ref(db, 'messages'), { user: name, text: text, timestamp: serverTimestamp() }); document.getElementById('msgInput').value = ''; }
        };
    }
    initNav(); renderDay(1);
</script>
</body>
</html>
