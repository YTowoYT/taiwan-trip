    document.addEventListener('touchmove', e => {
        if (!isDragging) return;
        let deltaY = e.touches[0].clientY - startY;
        let newTranslateY = currentTranslateY + deltaY;
        let maxTranslate = window.innerHeight * 0.80; 
        if (newTranslateY < 0) newTranslateY = 0; 
        if (newTranslateY > maxTranslate) newTranslateY = maxTranslate;
        sidePanel.style.transform = `translateY(${newTranslateY}px)`;
    }, {passive: true});

    document.addEventListener('touchend', e => {
        if (!isDragging) return;
        isDragging = false;
        let deltaY = e.changedTouches[0].clientY - startY;
        currentTranslateY += deltaY;
        let vh = window.innerHeight;
        let maxTranslate = vh * 0.80;
        if (currentTranslateY < 0) currentTranslateY = 0;
        if (currentTranslateY > maxTranslate) currentTranslateY = maxTranslate;

        sidePanel.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1)';
        let snapTop = 0, snapMid = vh * 0.45, snapBot = vh * 0.80;
        let diffTop = Math.abs(currentTranslateY - snapTop);
        let diffMid = Math.abs(currentTranslateY - snapMid);
        let diffBot = Math.abs(currentTranslateY - snapBot);
        
        let targetTranslate = snapMid;
        if (diffTop < diffMid && diffTop < diffBot) targetTranslate = snapTop;
        else if (diffBot < diffMid && diffBot < diffTop) targetTranslate = snapBot;
        
        currentTranslateY = targetTranslate;
        sidePanel.style.transform = `translateY(${currentTranslateY}px)`;
    });

    let map = L.map('map', { zoomControl: false }).setView([23.5, 121], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let currentLayerGroup = L.featureGroup().addTo(map);
    let routingControl = null;

    // === 初始化導航列 ===
    function initNav() {
        const nav = document.getElementById('navContainer');
        for (let i = 1; i <= 6; i++) {
            const btn = document.createElement('div');
            btn.className = `nav-pill ${i === 1 ? 'active' : ''}`;
            btn.innerText = `Day ${i}`;
            btn.onclick = () => { setActive(btn); renderDay(i); };
            nav.appendChild(btn);
        }
        
        const tabs = [
            { text: '注意事項', class: 'notes-btn', action: renderNotes },
            { text: '<i class="fa-regular fa-comments"></i> 留言板', class: 'chat-btn', action: renderChat },
            { text: '<i class="fa-solid fa-file-invoice-dollar"></i> 記帳區', class: 'acc-btn', action: renderAccounting }
        ];

        tabs.forEach(t => {
            const btn = document.createElement('div');
            btn.className = `nav-pill ${t.class}`;
            btn.innerHTML = t.text;
            btn.onclick = () => { setActive(btn); t.action(); };
            nav.appendChild(btn);
        });
    }
    
    function setActive(el) { 
        document.querySelectorAll('.nav-pill').forEach(b => b.classList.remove('active')); 
        el.classList.add('active'); 
        if(window.innerWidth <= 768) {
            currentTranslateY = window.innerHeight * 0.45;
            sidePanel.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1)';
            sidePanel.style.transform = `translateY(${currentTranslateY}px)`;
        }
    }
    
    function clearMap() { currentLayerGroup.clearLayers(); if (routingControl) map.removeControl(routingControl); }

    // === 地圖總覽渲染 ===
    function renderAllDaysMap() {
        clearMap();
        let allCoords = [];
        let iconIndex = 1;
        for (let i = 1; i <= 6; i++) {
            itineraryData[i].sections.forEach(sec => {
                sec.places.forEach(p => {
                    allCoords.push([p.lat, p.lng]);
                    const marker = L.marker([p.lat, p.lng], {
                        icon: L.divIcon({ className: '', html: `<div class="map-marker map-marker-small">${iconIndex++}</div>` })
                    }).addTo(currentLayerGroup);
                    marker.on('click', () => { window.openPlaceModal(p.name, p.img, p.rating, p.desc); });
                });
            });
        }
        if (allCoords.length > 1) { L.polyline(allCoords, {color: '#3b82f6', weight: 4, opacity: 0.7, dashArray: '8, 8'}).addTo(currentLayerGroup); }
        if (allCoords.length > 0) map.fitBounds(L.latLngBounds(allCoords), { padding: [30, 30] });
    }
    
    // === 單日行程渲染 ===
    function renderDay(day) {
        window.currentViewDay = day;
        const data = itineraryData[day];
        let html = `<div class="day-label">DAY ${day} <span class="day-date">${data.date}</span></div><h1 class="route-title">${data.title}</h1><p class="route-desc">${data.desc}</p>`;
        const coords = [];
        
        clearMap();
        let markerIndex = 1;

        data.sections.forEach(sec => {
            html += `<div class="time-section"><div class="time-label">${sec.label}`;
            if (day === 3 && sec.label === 'Morning' && !window.day3EggAdded) {
                html += ` <button class="easter-egg-btn" onclick="window.openEggModal()">🎁 點我尋找秘境</button>`;
            }
            html += `</div>`;

            sec.places.forEach(p => {
                if (p.driveTime) html += `<div class="drive-time-line"><i class="fa-solid fa-car-side"></i> ${p.driveTime}</div>`;
                const safeDesc = p.desc.replace(/'/g, "\\'").replace(/"/g, '"');
                const eggBadgeHTML = p.isEgg ? `<span class="egg-badge"><i class="fa-solid fa-wand-magic-sparkles"></i> 秘境彩蛋</span>` : '';
                const finalImg = window.customImages[p.name] || p.img;

                html += `
                    <div class="place-card" onclick="window.openPlaceModal('${p.name}', '${p.img}', '${p.rating}', '${safeDesc}')">
                        <div class="place-img-wrapper"><img class="place-img" src="${finalImg}"></div>
                        <div class="place-info">
                            <div class="place-time">${p.time} ${eggBadgeHTML}</div>
                            <h3 class="place-name">${p.name}</h3>
                            <div class="place-rating">${p.rating}</div>
                            <div class="place-desc">${p.desc}</div>
                        </div>
                    </div>`;
                
                const marker = L.marker([p.lat, p.lng], {
                    icon: L.divIcon({ className: '', html: `<div class="map-marker map-marker-large">${markerIndex}</div>` })
                }).addTo(currentLayerGroup);

                marker.on('click', () => { window.openPlaceModal(p.name, p.img, p.rating, p.desc); });
                coords.push([p.lat, p.lng]);
                markerIndex++;
            });
            html += `</div>`;
        });
        document.getElementById('panelContent').innerHTML = html;
        
        if (coords.length > 1) { routingControl = L.Routing.control({ waypoints: coords.map(c => L.latLng(c[0], c[1])), createMarker: () => null, show: false, lineOptions: { styles: [{color: '#3b82f6', weight: 5}] } }).addTo(map); }
        if (coords.length > 0) {
            if (day === 6) map.setView([25.0498, 121.5781], 15);
            else map.fitBounds(L.latLngBounds(coords), { padding: [50, 50] });
        }
    }
    
    // === 注意事項渲染 ===
    function renderNotes() {
        window.currentViewDay = null;
        let html = `
            <div class="day-label" style="color:#ca8a04; margin-top:0;">IMPORTANT</div>
            <h1 class="route-title" style="margin-bottom:0;">注意事項</h1>
            
            <div class="chat-input-area" style="border-top:none; padding-top:12px; border-bottom:1px solid #e2e8f0; padding-bottom:16px; flex-wrap:wrap;">
                <div style="width:100%; font-size:12px; color:#475569; margin-bottom:6px;">新增人: <strong>${getMyName() || '未綁定名字 (請先至留言板輸入)'}</strong></div>
                <input type="text" id="noteInput" placeholder="輸入新的注意事項...">
                <button id="addNoteBtn" ${!getMyName() ? 'disabled' : ''}>新增</button>
            </div>
            
            <div id="notesListArea" style="flex-grow:1; overflow-y:auto; margin-top:16px; padding-bottom:20px;">讀取中...</div>
        `;
        document.getElementById('panelContent').innerHTML = html;
        renderAllDaysMap();

        const notesRef = ref(db, 'notes');
        onValue(notesRef, (snap) => {
            const data = snap.val() || {};
            const listArea = document.getElementById('notesListArea');
            if(!listArea) return;
            
            let listHtml = '';
            let index = 1;
            
            for(let id in data) {
                const n = data[id];
                let delBtn = (n.user === getMyName()) ? `<button class="note-del-btn" onclick="window.deleteNote('${id}', '${n.user}')"><i class="fa-solid fa-trash"></i></button>` : '';
                
                listHtml += `
                <div class="note-card">
                    <div class="note-header">
                        <div class="note-badge">${index}</div>
                        <div class="note-author"><i class="fa-solid fa-user-pen"></i>${n.user}</div>
                        ${delBtn}
                    </div>
                    <div class="note-text">${n.text}</div>
                </div>`;
                index++;
            }
            if(Object.keys(data).length === 0) listHtml = '<div class="empty-hint">目前無任何注意事項，來新增第一筆吧！</div>';
            listArea.innerHTML = listHtml;
        });

        const noteAction = () => {
            const name = getMyName();
            const text = document.getElementById('noteInput').value.trim();
            if(!name) { alert("請先到留言板綁定你的名字喔！"); return; }
            if(text) {
                push(ref(db, 'notes'), { user: name, text: text, timestamp: serverTimestamp() });
                document.getElementById('noteInput').value = '';
            }
        };
        const btn = document.getElementById('addNoteBtn');
        const input = document.getElementById('noteInput');
        if(btn && input) {
            btn.onclick = noteAction;
            input.addEventListener('keypress', e => { if(e.key === 'Enter') noteAction(); });
        }
    }
    
    // === 互動留言板渲染 ===
    function renderChat() {
        window.currentViewDay = null;
        let html = `
            <div class="day-label" style="color:#166534; margin-top:0;">LIVE CHAT</div>
            <h1 class="route-title" style="margin-bottom:0;">互動留言板</h1>
            <div class="chat-container">
                <div class="chat-messages" id="chatMsgs">連線中...</div>
                <div class="chat-input-area">
                    <input type="text" id="nameInput" placeholder="你的名字" title="輸入一次後將自動綁定">
                    <input type="text" id="msgInput" placeholder="輸入訊息...">
                    <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>`;
        document.getElementById('panelContent').innerHTML = html;
        renderAllDaysMap();
        
        const myName = getMyName();
        const nameInput = document.getElementById('nameInput');
        if (myName) {
            nameInput.value = myName;
            nameInput.readOnly = true;
            nameInput.classList.add('locked');
            nameInput.ondblclick = function() {
                if(confirm("你要更改綁定的名字嗎？")) {
                    this.readOnly = false;
                    this.classList.remove('locked');
                    this.value = '';
                    localStorage.removeItem('familyTripName');
                }
            };
        }

        const msgsRef = ref(db, 'messages');
        onValue(msgsRef, (snapshot) => {
            const data = snapshot.val();
            const msgList = document.getElementById('chatMsgs');
            if (!msgList) return;
            msgList.innerHTML = '';
            const currentUser = getMyName();
            for (let id in data) {
                const m = data[id];
                const d = m.timestamp ? new Date(m.timestamp) : new Date();
                const monthDay = `${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getDate().toString().padStart(2, '0')}`;
                const timeStr = `${monthDay} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
                let actionBtnsHTML = '';
                let bubbleClass = 'msg-bubble';
                
                if (m.user === currentUser && currentUser !== '') {
                    bubbleClass += ' has-actions';
                    actionBtnsHTML = `<div class="msg-actions">
                        <button class="msg-action-btn" onclick="window.editMsg('${id}', '${m.text}', '${m.user}')"><i class="fa-solid fa-pen"></i></button>
                        <button class="msg-action-btn" onclick="window.deleteMsg('${id}', '${m.user}')"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
                }
                msgList.innerHTML += `
                    <div class="${bubbleClass}">${actionBtnsHTML}
                        <div class="msg-user"><i class="fa-solid fa-user-circle"></i> ${m.user || '旅伴'}</div>
                        <div>${m.text}</div>
                        <div class="msg-time">${timeStr}</div>
                    </div>`;
            }
            setTimeout(() => { msgList.scrollTop = msgList.scrollHeight; }, 100);
        });
        
        const sendAction = () => {
            const currentNameInput = document.getElementById('nameInput');
            let name = currentNameInput.value.trim();
            const text = document.getElementById('msgInput').value.trim();
            
            if (text === '//名單' || text === '／／名單') {
                get(ref(db, 'messages')).then(snap1 => {
                    const users = new Set();
                    if (snap1.exists()) { Object.values(snap1.val()).forEach(m => { if(m.user) users.add(m.user); }); }
                    get(ref(db, 'expenses')).then(snap2 => {
                        if (snap2.exists()) { Object.values(snap2.val()).forEach(e => { if(e.user) users.add(e.user); }); }
                        const userList = Array.from(users);
                        alert(`【系統密技】目前共有 ${userList.length} 人留過紀錄：\n\n${userList.join('\n')}`);
                    });
                });
                document.getElementById('msgInput').value = '';
                return;
            }

            if (!name) { alert("請先輸入你的名字喔！"); currentNameInput.focus(); return; }
            if (text) { 
                if (!currentNameInput.readOnly) {
                    localStorage.setItem('familyTripName', name);
                    currentNameInput.readOnly = true;
                    currentNameInput.classList.add('locked');
                }
                push(ref(db, 'messages'), { user: name, text: text, timestamp: serverTimestamp() }); 
                document.getElementById('msgInput').value = ''; 
                document.getElementById('msgInput').focus();
            }
        };
        document.getElementById('sendBtn').onclick = sendAction;
        document.getElementById('msgInput').addEventListener('keypress', function (e) { if (e.key === 'Enter') sendAction(); });
    }

    // === 分流記帳區渲染 ===
    function renderAccounting() {
        window.currentViewDay = null;
        let html = `
            <div class="day-label" style="color:#991b1b; margin-top:0;">ACCOUNTING</div>
            <h1 class="route-title" style="margin-bottom:0;">分流記帳區</h1>
            
            <div class="acc-settings-row">
                大人: <input type="number" id="adultsInput" class="acc-settings-input" onchange="window.updateFundSettings('adults', this.value)"> 人
                預收: $ <input type="number" id="fundInput" class="acc-settings-input wide" onchange="window.updateFundSettings('perPerson', this.value)"> /人
            </div>
            
            <div id="fundStatusBox" class="fund-status good">讀取中...</div>
            
            <div class="acc-recorder-label">記錄人: <strong>${getMyName() || '未綁定(請至留言板輸入)'}</strong></div>
            
            <div class="chat-input-area acc-input-wrapper">
                <select id="expTypeInput" ${!getMyName() ? 'disabled' : ''}>
                    <option value="fund">🤑公帳</option>
                    <option value="advance">💳代墊</option>
                </select>
                <input type="text" id="expItemInput" placeholder="項目" ${!getMyName() ? 'disabled' : ''}>
                <input type="number" id="expPriceInput" placeholder="金額" ${!getMyName() ? 'disabled' : ''}>
                <button id="addExpBtn" ${!getMyName() ? 'disabled' : ''}>新增</button>
            </div>
            
            <div id="expenseListArea"></div>
        `;
        document.getElementById('panelContent').innerHTML = html;
        renderAllDaysMap();

        const fundRef = ref(db, 'fund_settings');
        const expRef = ref(db, 'expenses');
        let currentFundTotal = 0;
        let currentSpentTotal = 0;
        let totalAdvanceTotal = 0;
        let globalAdultsCount = 6;

        onValue(fundRef, (snap) => {
            let settings = snap.val() || { adults: 6, perPerson: 5000 };
            const adInput = document.getElementById('adultsInput');
            const fnInput = document.getElementById('fundInput');
            if(adInput && fnInput) { adInput.value = settings.adults; fnInput.value = settings.perPerson; }
            currentFundTotal = settings.adults * settings.perPerson;
            globalAdultsCount = settings.adults;
            updateFundStatusBox();
        });

        onValue(expRef, (snap) => {
            const data = snap.val() || {};
            const listArea = document.getElementById('expenseListArea');
            if (!listArea) return;
            
            let groupedFund = {};
            let groupedAdvance = {};
            currentSpentTotal = 0;
            totalAdvanceTotal = 0;

            for (let id in data) {
                const item = data[id];
                const itemType = item.type || 'fund'; 
                const itemPrice = Number(item.price);

                if (itemType === 'fund') {
                    if (!groupedFund[item.user]) groupedFund[item.user] = { total: 0, items: [] };
                    groupedFund[item.user].items.push({ id: id, name: item.item, price: itemPrice });
                    groupedFund[item.user].total += itemPrice;
                    currentSpentTotal += itemPrice;
                } else {
                    if (!groupedAdvance[item.user]) groupedAdvance[item.user] = { total: 0, items: [] };
                    groupedAdvance[item.user].items.push({ id: id, name: item.item, price: itemPrice });
                    groupedAdvance[item.user].total += itemPrice;
                    totalAdvanceTotal += itemPrice;
                }
            }

            let listHtml = '<h3 class="acc-section-title acc-title-fund"><i class="fa-solid fa-wallet"></i> 1. 公積金花費明細 (扣公帳)</h3>';
            let hasFundData = false;
            for (let user in groupedFund) {
                hasFundData = true;
                const uData = groupedFund[user];
                listHtml += `<div class="expense-group"><div class="expense-user"><i class="fa-regular fa-user"></i> ${user}</div><div class="expense-items">`;
                uData.items.forEach(i => {
                    let delBtn = (user === getMyName()) ? `<button class="expense-item-del" onclick="window.deleteExp('${i.id}', '${user}')"><i class="fa-solid fa-xmark"></i></button>` : '';
                    listHtml += `<div class="expense-item"><span>${i.name} - $${i.price}</span>${delBtn}</div>`;
                });
                listHtml += `<div class="expense-total">小計：$${uData.total}</div></div></div>`;
            }
            if(!hasFundData) listHtml += '<div class="empty-hint">暫無公積金花費</div>';

            listHtml += '<h3 class="acc-section-title acc-title-advance"><i class="fa-solid fa-credit-card"></i> 2. 個人代墊明細 (行前/大筆費用)</h3>';
            let hasAdvanceData = false;
            for (let user in groupedAdvance) {
                hasAdvanceData = true;
                const uData = groupedAdvance[user];
                listHtml += `<div class="expense-group"><div class="expense-user"><i class="fa-regular fa-user"></i> ${user}</div><div class="expense-items">`;
                uData.items.forEach(i => {
                    let delBtn = (user === getMyName()) ? `<button class="expense-item-del" onclick="window.deleteExp('${i.id}', '${user}')"><i class="fa-solid fa-xmark"></i></button>` : '';
                    listHtml += `<div class="expense-item"><span>${i.name} - $${i.price}</span>${delBtn}</div>`;
                });
                listHtml += `<div class="expense-total advance">代墊總額：$${uData.total}</div></div></div>`;
            }
            if(!hasAdvanceData) listHtml += '<div class="empty-hint">暫無個人代墊款項</div>';

            let remain = currentFundTotal - currentSpentTotal;
            let avgAdvance = globalAdultsCount > 0 ? Math.round(totalAdvanceTotal / globalAdultsCount) : 0;
            
            let summaryHtml = `
                <div class="summary-area">
                    <div class="summary-title"> ------ 總結 ------</div>
                    <div class="summary-row"><span>公積金總預收：</span><span>$${currentFundTotal}</span></div>
                    <div class="summary-row"><span>公積金總支出：</span><span>$${currentSpentTotal}</span></div>
                    <div class="summary-row bold" style="color:${remain >= 0 ? '#16a34a' : '#dc2626'}"><span>公積金剩餘現金：</span><span>$${remain}</span></div>
                    <div class="summary-divider"></div>
                    <div class="summary-row"><span>全體代墊總額：</span><span>$${totalAdvanceTotal}</span></div>
                    <div class="summary-row advance-final"><span>每人應分攤代墊費：</span><span>$${avgAdvance} /人</span></div>
                    <div class="summary-hint">
                        💡 結算小提示：<br>
                        1. 公積金剩餘現金為正數，可在旅程結束後退還大家。<br>
                        2. 個人代墊部分，最後結算時每人總共需轉出 $${avgAdvance} 給當初有代墊的人（多退少補，非常公平！）。
                    </div>
                </div>`;
            
            listArea.innerHTML = listHtml + summaryHtml;
            updateFundStatusBox();
        });

        function updateFundStatusBox() {
            const box = document.getElementById('fundStatusBox');
            if(!box) return;
            let remain = currentFundTotal - currentSpentTotal;
            box.innerHTML = `<div>公積金總額: $${currentFundTotal}</div><div>目前剩餘: $${remain}</div>`;
            if (remain < (currentFundTotal / 3)) {
                box.className = 'fund-status warning';
                box.innerHTML += `<div class="fund-status-icon"><i class="fa-solid fa-triangle-exclamation"></i> 需補足公積金</div>`;
            } else {
                box.className = 'fund-status good';
                box.innerHTML += `<div class="fund-status-icon"><i class="fa-solid fa-circle-check"></i> 公積金充裕</div>`;
            }
        }

        const expAction = () => {
            const name = getMyName();
            const type = document.getElementById('expTypeInput').value;
            const item = document.getElementById('expItemInput').value.trim();
            const price = document.getElementById('expPriceInput').value.trim();
            if (!name) return;
            if (item && price) {
                push(ref(db, 'expenses'), { user: name, type: type, item: item, price: Number(price), timestamp: serverTimestamp() });
                document.getElementById('expItemInput').value = '';
                document.getElementById('expPriceInput').value = '';
                document.getElementById('expItemInput').focus();
            }
        };
        document.getElementById('addExpBtn').onclick = expAction;
        document.getElementById('expPriceInput').addEventListener('keypress', function (e) { if (e.key === 'Enter') expAction(); });
    }

    initNav(); renderDay(1);
</script>
</body>
</html>
