    var sidePanel = document.getElementById('sidePanel');
    var dragHandle = document.getElementById('dragHandle');

    function setInitialMobilePanel() {
      if (window.innerWidth <= 768) {
        var currentTranslateY = window.innerHeight * 0.45;
        sidePanel.style.transform = 'translateY(' + currentTranslateY + 'px)';
        sidePanel.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1)';
      } else {
        sidePanel.style.transform = 'none';
      }
    }
    window.addEventListener('resize', setInitialMobilePanel);
    setInitialMobilePanel();

    var startY = 0;
    var isDragging = false;

    dragHandle.addEventListener('touchstart', function(e) {
      if (window.innerWidth > 768) return;
      startY = e.touches[0].clientY;
      sidePanel.style.transition = 'none';
      isDragging = true;
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      var deltaY = e.touches[0].clientY - startY;
      var currentTransform = sidePanel.style.transform.match(/translateY\((.*)px\)/);
      var baseTranslate = currentTransform ? parseFloat(currentTransform[1]) : (window.innerHeight * 0.45);
      var newTranslateY = baseTranslate + deltaY;
      var maxTranslate = window.innerHeight * 0.80;
      if (newTranslateY < 0) newTranslateY = 0;
      if (newTranslateY > maxTranslate) newTranslateY = maxTranslate;
      sidePanel.style.transform = 'translateY(' + newTranslateY + 'px)';
      startY = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', function() {
      if (!isDragging) return;
      isDragging = false;
      var currentTransform = sidePanel.style.transform.match(/translateY\((.*)px\)/);
      var currentTranslateY = currentTransform ? parseFloat(currentTransform[1]) : (window.innerHeight * 0.45);
      var vh = window.innerHeight;
      sidePanel.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1)';
      var snapTop = 0;
      var snapMid = vh * 0.45;
      var snapBot = vh * 0.80;
      var diffTop = Math.abs(currentTranslateY - snapTop);
      var diffMid = Math.abs(currentTranslateY - snapMid);
      var diffBot = Math.abs(currentTranslateY - snapBot);
      var targetTranslate = snapMid;
      if (diffTop < diffMid && diffTop < diffBot) targetTranslate = snapTop;
      else if (diffBot < diffMid && diffBot < diffTop) targetTranslate = snapBot;
      sidePanel.style.transform = 'translateY(' + targetTranslate + 'px)';
    });

    // Firebase Realtime Database 的 key 不能包含 . # $ [ ] /

    function getSafeImageKey(name) {

    window.changeTime = function(day, sIdx, pIdx, oldTime) {
      var newTime = prompt("【時間推算系統】\n請輸入新的出發/抵達時間 (格式 HH:MM，例如 08:30)：\n\n修改後，系統會自動幫您推算並順延今日後續的所有行程時間！", oldTime);
      if (newTime === null || newTime.trim() === "") return;

      var regex = /^([01]\d|2[0-3]):([0-5]\d)$/;
      if (!regex.test(newTime.trim())) {
        alert("格式錯誤！請輸入完整的時與分，例如 08:30 或 14:15");
        return;
      }

      var oldParts = oldTime.split(":");
      var newParts = newTime.trim().split(":");
      var oldMins = parseInt(oldParts[0], 10) * 60 + parseInt(oldParts[1], 10);
      var newMins = parseInt(newParts[0], 10) * 60 + parseInt(newParts[1], 10);
      var diff = newMins - oldMins;

      if (diff === 0) return;

      var data = itineraryData[day];
      var startApplying = false;

      for (var s = 0; s < data.sections.length; s++) {
        var sec = data.sections[s];
        for (var p = 0; p < sec.places.length; p++) {
          if (s === sIdx && p === pIdx) startApplying = true;
          if (startApplying) {
            var place = sec.places[p];
            var pParts = place.time.split(":");
            var pMins = parseInt(pParts[0], 10) * 60 + parseInt(pParts[1], 10);
            pMins += diff;

            if (pMins < 0) pMins += 24 * 60;
            if (pMins >= 24 * 60) pMins -= 24 * 60;

            var outH = Math.floor(pMins / 60).toString();
            var outM = (pMins % 60).toString();
            if (outH.length === 1) outH = "0" + outH;
            if (outM.length === 1) outM = "0" + outM;

            place.time = outH + ":" + outM;
          }
        }
      }

      renderDay(day);
    };

      var sidePanel = document.getElementById('sidePanel');

      var app = document.querySelector('.app-container');

    function initNav() {
      var nav = document.getElementById('navContainer');

      for (var i = 1; i <= 6; i++) {
        (function(dayIndex) {
          var btn = document.createElement('div');
          btn.className = "nav-pill " + (dayIndex === 1 ? 'active' : '');
          btn.innerText = "Day " + dayIndex;
          btn.onclick = function() {
            setActive(btn);
            renderDay(dayIndex);
          };
          nav.appendChild(btn);
        })(i);
      }

      var tabs = [
        { text: '<i class="fa-solid fa-bowl-food"></i> 想吃清單', class: 'food-btn', action: renderFoodWishlist },
        { text: '注意事項', class: 'notes-btn', action: renderNotes },
        { text: '<i class="fa-regular fa-comments"></i> 留言板', class: 'chat-btn', action: renderChat },
        { text: '<i class="fa-solid fa-file-invoice-dollar"></i> 記帳區', class: 'acc-btn', action: renderAccounting }
      ];

      tabs.forEach(function(t) {
        var btn = document.createElement('div');
        btn.className = "nav-pill " + t.class;
        btn.innerHTML = t.text;
        btn.onclick = function() {
          setActive(btn);
          t.action();

    function setActive(el) {
      var pills = document.querySelectorAll('.nav-pill');
      for (var i = 0; i < pills.length; i++) {
        pills[i].classList.remove('active');
      }
      el.classList.add('active');

      if (window.innerWidth <= 768) {
        var currentTranslateY = window.innerHeight * 0.45;
        sidePanel.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1)';
        sidePanel.style.transform = 'translateY(' + currentTranslateY + 'px)';
      }
    }

    function clearMap() {
      currentLayerGroup.clearLayers();
      if (routingControl) {
        map.removeControl(routingControl);
        routingControl = null;
      }
    }

    function renderAllDaysMap() {
      clearMap();
      var allCoords = [];
      var iconIndex = 1;

      for (var i = 1; i <= 6; i++) {
        itineraryData[i].sections.forEach(function(sec) {
          sec.places.forEach(function(p) {
            allCoords.push([p.lat, p.lng]);
            var marker = L.marker([p.lat, p.lng], {
              icon: L.divIcon({ className: '', html: '<div class="map-marker map-marker-small">' + (iconIndex++) + '</div>' })
            }).addTo(currentLayerGroup);
            marker.on('click', function() {
              window.openPlaceModal(p.name, p.img, p.rating, p.desc);
            });
          });
        });
      }

      if (allCoords.length > 1) {
        L.polyline(allCoords, { color: '#0ea5e9', weight: 4, opacity: 0.7, dashArray: '8, 8' }).addTo(currentLayerGroup);
      }
      if (allCoords.length > 0) {
        map.fitBounds(L.latLngBounds(allCoords), { padding: [30, 30] });
      }
    }

    function safeForOnclick(value) {
      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\n/g, " ")
        .replace(/\r/g, " ");
    }

    function renderDay(day) {
      setMapMode();
      window.currentViewDay = day;
      var data = itineraryData[day];

      var html = '<div class="day-label">DAY ' + day + ' <span class="day-date">' + data.date + '</span></div><h1 class="route-title">' + data.title + '</h1><p class="route-desc">' + data.desc + '</p>';
      var coords = [];

      clearMap();
      var markerIndex = 1;

      data.sections.forEach(function(sec, sIdx) {
        html += '<div class="time-section"><div class="time-label">' + sec.label + '</div>';

        sec.places.forEach(function(p, pIdx) {
          if (p.driveTime) {
            html += '<div class="drive-time-line"><i class="fa-solid fa-car-side"></i> ' + p.driveTime + '</div>';
          }

          var finalImg = getCustomImageForPlace(p.name) || p.img;
          var safeName = safeForOnclick(p.name);
          var safeImg = safeForOnclick(p.img);
          var safeRating = safeForOnclick(p.rating);
          var safeDesc = safeForOnclick(p.desc);

          html +=
            '<div class="place-card" onclick="window.openPlaceModal(\'' + safeName + '\', \'' + safeImg + '\', \'' + safeRating + '\', \'' + safeDesc + '\')">' +
              '<div class="place-img-wrapper"><img class="place-img" src="' + finalImg + '" alt="' + p.name + '"></div>' +
              '<div class="place-info">' +
                '<div class="place-time-btn" onclick="window.changeTime(' + day + ', ' + sIdx + ', ' + pIdx + ', \'' + p.time + '\'); event.stopPropagation();" title="點擊推算後續時間">' +
                  '<i class="fa-solid fa-pen"></i> ' + p.time +
                '</div>' +
                '<h3 class="place-name">' + p.name + '</h3>' +
                '<div class="place-rating">' + p.rating + '</div>' +
                '<div class="place-desc">' + p.desc + '</div>' +
              '</div>' +
            '</div>';

          var marker = L.marker([p.lat, p.lng], {
            icon: L.divIcon({ className: '', html: '<div class="map-marker map-marker-large">' + markerIndex + '</div>' })
          }).addTo(currentLayerGroup);

          marker.on('click', function() {
            window.openPlaceModal(p.name, p.img, p.rating, p.desc);
          });

          coords.push([p.lat, p.lng]);
          markerIndex++;
        });

        html += '</div>';
      });

      document.getElementById('panelContent').innerHTML = html + '<div id="todayFoodArea"></div>';
      renderTodayFoodSummary(day);

      if (coords.length > 1) {
        routingControl = L.Routing.control({
          waypoints: coords.map(function(c) { return L.latLng(c[0], c[1]); }),
          createMarker: function() { return null; },
          show: false,
          lineOptions: { styles: [{ color: '#0ea5e9', weight: 6, opacity: 0.8 }] }
        }).addTo(map);
      }

      if (coords.length > 0) {
        // Day 1～Day 6 統一用當天所有點位自動縮放，
        // 讓 Day 6 也能同時看到起點與終點，不再只跳回台北終點。
        map.fitBounds(L.latLngBounds(coords), { padding: [50, 50] });
      }
    }

      var disabledAttr = !getMyName() ? 'disabled' : '';

    function renderChat() {
      setInfoMode();
      window.currentViewDay = null;

      var html =
        '<div class="day-label" style="color:#166534; margin-top:0;">LIVE CHAT</div>' +
        '<h1 class="route-title" style="margin-bottom:0;">互動留言板</h1>' +
        '<div class="chat-container">' +
          '<div class="chat-messages" id="chatMsgs">連線中...</div>' +
          '<div class="chat-input-area">' +
            '<input type="text" id="nameInput" placeholder="右上設定名字" title="名字確認後會自動鎖定">' +
            '<input type="text" id="msgInput" placeholder="輸入訊息...">' +
            '<button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>' +
          '</div>' +
        '</div>';

      document.getElementById('panelContent').innerHTML = html;
      renderAllDaysMap();

      var myName = getMyName();
      var nameInput = document.getElementById('nameInput');

      if (myName) {
        nameInput.value = myName;
        nameInput.readOnly = true;
        nameInput.classList.add('locked');
        nameInput.ondblclick = function() {
          if (confirm("你要更改綁定的名字嗎？")) {
            this.readOnly = false;
            this.classList.remove('locked');
            this.value = '';
            localStorage.removeItem('familyTripName');
          }
        };
      }

      var msgsRef = ref(db, 'messages');

      onValue(msgsRef, function(snapshot) {
        var data = snapshot.val() || {};
        var msgList = document.getElementById('chatMsgs');
        if (!msgList) return;

        msgList.innerHTML = '';
        var currentUser = getMyName();

        for (var id in data) {
          var m = data[id];
          var d = m.timestamp ? new Date(m.timestamp) : new Date();
          var monthDay = (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getDate().toString().padStart(2, '0');
          var timeStr = monthDay + ' ' + d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');

          var actionBtnsHTML = '';
          var bubbleClass = 'msg-bubble';

          if (m.user === currentUser && currentUser !== '') {
            bubbleClass += ' has-actions';
            actionBtnsHTML =
              '<div class="msg-actions">' +
                '<button class="msg-action-btn" onclick="window.editMsg(\'' + id + '\', \'' + safeForOnclick(m.text) + '\', \'' + safeForOnclick(m.user) + '\')"><i class="fa-solid fa-pen"></i></button>' +
                '<button class="msg-action-btn" onclick="window.deleteMsg(\'' + id + '\', \'' + safeForOnclick(m.user) + '\')"><i class="fa-solid fa-trash"></i></button>' +
              '</div>';
          }

          var userDisplay = m.user || '旅伴';

          msgList.innerHTML +=
            '<div class="' + bubbleClass + '">' + actionBtnsHTML +
              '<div class="msg-user"><i class="fa-solid fa-user-circle"></i> ' + userDisplay + '</div>' +
              '<div>' + (m.text || '') + '</div>' +
              '<div class="msg-time">' + timeStr + '</div>' +
            '</div>';
        }

        setTimeout(function() {
          msgList.scrollTop = msgList.scrollHeight;
        }, 100);
      });

      var sendAction = function() {
        var currentNameInput = document.getElementById('nameInput');
        var name = currentNameInput.value.trim();
        var text = document.getElementById('msgInput').value.trim();

        if (text === '//名單' || text === '／／名單') {
          get(ref(db, 'messages')).then(function(snap1) {
            var users = [];
            if (snap1.exists()) {
              Object.values(snap1.val()).forEach(function(m) {
                if (m.user && users.indexOf(m.user) === -1) users.push(m.user);
              });
            }
            get(ref(db, 'expenses')).then(function(snap2) {
              if (snap2.exists()) {
                Object.values(snap2.val()).forEach(function(e) {
                  if (e.user && users.indexOf(e.user) === -1) users.push(e.user);
                });
              }
              alert("【系統密技】目前共有 " + users.length + " 人留過紀錄：\n\n" + users.join('\n'));
            });
          });

          document.getElementById('msgInput').value = '';
          return;
        }

        if (!name) {
          alert("請先輸入你的名字喔！");
          currentNameInput.focus();
          return;
        }

        if (text) {
          if (!currentNameInput.readOnly) {
            localStorage.setItem('familyTripName', name);
            currentNameInput.readOnly = true;
            currentNameInput.classList.add('locked');
          }

          push(ref(db, 'messages'), { user: name, text: text, timestamp: serverTimestamp() });
          document.getElementById('msgInput').value = '';
          document.getElementById('msgInput').focus();
        }
      };

      document.getElementById('sendBtn').onclick = sendAction;
      document.getElementById('msgInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendAction();
      });
    }


    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getFoodDefaultImage(name) {
      var imgs = [
        'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=600&q=80',
        'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80',
        'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=600&q=80',
        'https://images.unsplash.com/photo-1482049016688-2d3e1b311543?auto=format&fit=crop&w=600&q=80'
      ];
      var sum = 0;
      String(name || '').split('').forEach(function(ch) { sum += ch.charCodeAt(0); });
      return imgs[sum % imgs.length];
    }

    function getFoodMapUrl(food) {
      return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(food.name || '');
    }

    function getFoodDayLabel(day) {
      if (day === 'any') return '不限';
      return 'Day ' + day;
    }

    function getFoodVotesCount(votes) {
      return votes ? Object.keys(votes).filter(function(k) { return votes[k]; }).length : 0;
    }

    function sortFoodWishes(arr) {
      return arr.sort(function(a, b) {
        var voteDiff = getFoodVotesCount(b.votes) - getFoodVotesCount(a.votes);
        if (voteDiff !== 0) return voteDiff;
        return (b.timestamp || 0) - (a.timestamp || 0);
      });
    }

    window.toggleFoodVote = function(foodId, alreadyVoted) {
      var name = getMyName();
      if (!name) {
        alert("請先點右上角設定名字，才可以投票喔！");
        return;
      }
      var voteKey = getSafeImageKey(name);
      var updateData = {};
      updateData[voteKey] = alreadyVoted ? null : true;
      update(ref(db, 'food_wishes/' + foodId + '/votes'), updateData);
    };

    window.changeFoodImage = function(foodId, owner) {
      if (owner !== getMyName()) {
        alert("只能更換自己新增的美食圖片喔！");
        return;
      }
      var newUrl = prompt("請貼上新的圖片網址：");
      if (newUrl && newUrl.trim()) {
        update(ref(db, 'food_wishes/' + foodId), { image: newUrl.trim() });
      }
    };

    window.deleteFoodWish = function(foodId, owner) {
      if (owner !== getMyName()) {
        alert("只能刪除自己新增的想吃項目喔！");
        return;
      }
      if (confirm("確定要刪除這筆想吃項目嗎？")) {
        remove(ref(db, 'food_wishes/' + foodId));
      }
    };

    function buildFoodCard(food) {
      var voteKey = getSafeImageKey(getMyName() || '');
      var alreadyVoted = !!(food.votes && food.votes[voteKey]);
      var votes = getFoodVotesCount(food.votes);
      var safeId = safeForOnclick(food.id || '');
      var safeUser = safeForOnclick(food.user || '');
      var delButton = food.user === getMyName()
        ? '<button class="food-del-btn" onclick="window.deleteFoodWish(\'' + safeId + '\', \'' + safeUser + '\')"><i class="fa-solid fa-trash"></i> 刪除</button>'
        : '';

      return '' +
        '<div class="food-wish-card">' +
          '<div>' +
            '<div class="food-wish-title"><a class="food-name-link" href="' + escapeHtml(getFoodMapUrl(food)) + '" target="_blank">' + escapeHtml(food.name || '未命名美食') + '</a></div>' +
            '<div class="food-wish-meta">新增人：' + escapeHtml(food.user || '旅伴') + '　❤️ ' + votes + ' 人想吃</div>' +
          '</div>' +
          '<div class="food-wish-actions">' +
            '<button class="food-vote-btn ' + (alreadyVoted ? 'voted' : '') + '" onclick="window.toggleFoodVote(\'' + safeId + '\', ' + alreadyVoted + ')">' + (alreadyVoted ? '❤️ 已想吃' : '♡ 想吃') + '</button>' +
            delButton +
          '</div>' +
        '</div>';
    }

    function renderFoodWishlist() {
      setInfoMode();
      window.currentViewDay = null;

      if (window.todayFoodUnsub) {
        window.todayFoodUnsub();
        window.todayFoodUnsub = null;
      }

      var myName = getMyName();
      var disabledAttr = myName ? '' : 'disabled';

      var html =
        '<div class="food-page">' +
          '<div>' +
            '<div class="day-label" style="color:#f97316; margin-top:0;">FOOD WISHLIST</div>' +
            '<h1 class="route-title" style="margin-bottom:6px;">想吃清單</h1>' +
          '</div>' +
          '<div class="food-form-box">' +
            '<div class="food-form-title">新增想吃</div>' +
            '<select id="foodDayInput" ' + disabledAttr + '>' +
              '<option value="1">Day 1</option>' +
              '<option value="2">Day 2</option>' +
              '<option value="3">Day 3</option>' +
              '<option value="4">Day 4</option>' +
              '<option value="5">Day 5</option>' +
              '<option value="6">Day 6</option>' +
              '<option value="any">不限</option>' +
            '</select>' +
            '<input type="text" id="foodNameInput" placeholder="店名／想吃的東西，例如：阿興生魚片" ' + disabledAttr + '>' +
            '<button class="food-add-btn" id="addFoodBtn" ' + disabledAttr + '>＋ 新增想吃</button>' +
            (!myName ? '<div class="food-name-hint">請先點右上角設定名字，才可以新增與投票。</div>' : '') +
          '</div>' +
          '<div id="foodListArea"><div class="food-empty">讀取中...</div></div>' +
        '</div>';

      document.getElementById('panelContent').innerHTML = html;
      renderAllDaysMap();

      if (window.foodWishlistUnsub) window.foodWishlistUnsub();

      window.foodWishlistUnsub = onValue(ref(db, 'food_wishes'), function(snap) {
        var data = snap.val() || {};
        var groups = { '1': [], '2': [], '3': [], '4': [], '5': [], '6': [], 'any': [] };

        Object.keys(data).forEach(function(id) {
          var food = data[id] || {};
          food.id = id;
          var dayKey = food.day || 'any';
          if (!groups[dayKey]) groups[dayKey] = [];
          groups[dayKey].push(food);
        });

        var output = '';
        var hasAny = false;

        ['1','2','3','4','5','6','any'].forEach(function(dayKey) {
          var arr = sortFoodWishes(groups[dayKey] || []);

          if (!arr.length && dayKey !== 'any') {
            output += '<div class="food-day-section"><div class="food-day-label day-' + dayKey + '">' + getFoodDayLabel(dayKey) + '</div><div class="food-empty">目前還沒有想吃項目</div></div>';
            return;
          }
          if (!arr.length && dayKey === 'any') return;

          hasAny = true;
          output += '<div class="food-day-section"><div class="food-day-label day-' + dayKey + '">' + getFoodDayLabel(dayKey) + '</div><div class="food-card-list">';
          arr.forEach(function(food) {
            output += buildFoodCard(food);
          });
          output += '</div></div>';
        });

        if (!hasAny) {
          output = '<div class="food-empty">目前還沒有人新增想吃的東西。</div>' + output;
        }

        var listArea = document.getElementById('foodListArea');
        if (listArea) listArea.innerHTML = output;
      });

      var addFoodAction = function() {
        var name = getMyName();
        if (!name) {
          alert("請先點右上角設定名字。");
          return;
        }

        var day = document.getElementById('foodDayInput').value;
        var foodName = document.getElementById('foodNameInput').value.trim();

        if (!foodName) {
          alert("請輸入店名或想吃的東西。");
          return;
        }

        push(ref(db, 'food_wishes'), {
          user: name,
          day: day,
          name: foodName,

          modal.classList.remove('hidden');
          input.value = '';
          setTimeout(function() { input.focus(); }, 80);
          return false;
        }

        function closeFixedNameModal() {
          var modal = document.getElementById('fixedNameModal');
          if (modal) modal.classList.add('hidden');
        }

        function confirmFixedName() {
          var input = document.getElementById('fixedNameInput');
          var name = input ? input.value.trim() : '';
          if (!name) {
            alert('請輸入名字。');
            return;
          }

          localStorage.setItem('familyTripName', name);
          closeFixedNameModal();
          updateFixedUserChip();
          location.reload();

        function bindFixedNameControls() {
          var chip = document.getElementById('fixedUserChip');
          var cancel = document.getElementById('fixedNameCancel');
          var confirm = document.getElementById('fixedNameConfirm');
          var input = document.getElementById('fixedNameInput');

          if (chip && !chip.dataset.fixedNameBound) {
            chip.addEventListener('click', openFixedNameModal, true);
            chip.dataset.fixedNameBound = '1';

          if (cancel && !cancel.dataset.fixedNameBound) {

          if (confirm && !confirm.dataset.fixedNameBound) {

        function isDayMode() {
          var app = document.querySelector('.app-container');
          return app && !app.classList.contains('info-mode') && !document.body.classList.contains('info-mode');
        }

        function getPanel() {
          return document.getElementById('sidePanel');
        }

        function getPanelVH(panel) {
          var rect = panel.getBoundingClientRect();
          return (rect.height / window.innerHeight) * 100;
        }

        function setPanelVH(panel, vh) {
          var next = Math.max(MIN_VH, Math.min(MAX_VH, vh));
          panel.style.setProperty('--day-panel-height', next + 'vh');
          panel.style.height = next + 'vh';
          panel.style.maxHeight = next + 'vh';
        }

        function prepareDayPanel() {
          var app = document.querySelector('.app-container');
          var panel = getPanel();
          var content = document.getElementById('panelContent');

          if (!app || !panel || !content || !isDayMode()) return;

          panel.classList.remove('full-info-panel');
          panel.classList.add('day-real-drag-panel');

          panel.style.display = 'flex';
          panel.style.visibility = 'visible';
          panel.style.opacity = '1';

          if (window.innerWidth <= 768) {
            panel.style.transform = 'none';
          }

          var oldHandle = panel.querySelector('.day-real-drag-handle');
          if (!oldHandle) {
            oldHandle = document.createElement('div');
            oldHandle.className = 'day-real-drag-handle';
            oldHandle.setAttribute('aria-label', '拖曳調整行程面板高度');
            panel.insertBefore(oldHandle, content);
          }

          if (!panel.dataset.realDragDefault) {
            setPanelVH(panel, MID_VH);
            panel.dataset.realDragDefault = '1';
          }

          bindHandle(oldHandle, panel);
        }

        function bindHandle(handle, panel) {
          if (handle.dataset.realDragBound === '1') return;
          handle.dataset.realDragBound = '1';

          handle.addEventListener('pointerdown', function(e) {
            if (!isDayMode()) return;

            isDragging = true;
            startY = e.clientY;
            startVH = getPanelVH(panel);
            panel.classList.add('day-real-dragging');

            try {
              handle.setPointerCapture(e.pointerId);
            } catch (err) {}

            e.preventDefault();
          }, { passive: false });

          handle.addEventListener('pointermove', function(e) {
            if (!isDragging) return;

            var movePx = startY - e.clientY;
            var moveVH = (movePx / window.innerHeight) * 100;
            setPanelVH(panel, startVH + moveVH);

            e.preventDefault();
          }, { passive: false });

          function stopDrag(e) {
            if (!isDragging) return;

            isDragging = false;
            panel.classList.remove('day-real-dragging');

            var current = getPanelVH(panel);
            var target = MID_VH;

            if (current < 43) target = MIN_VH;
            else if (current > 70) target = MAX_VH;
            else target = MID_VH;

            setPanelVH(panel, target);

            try {
              handle.releasePointerCapture(e.pointerId);
            } catch (err) {}
          }

          handle.addEventListener('pointerup', stopDrag);
          handle.addEventListener('pointercancel', stopDrag);
        }

        function watchDayButtons() {
          document.addEventListener('click', function(e) {
            var target = e.target && e.target.closest ? e.target.closest('.nav-pill') : null;
            if (!target) return;

            var txt = target.textContent || '';
            if (/Day\s*[1-6]/i.test(txt)) {
              setTimeout(prepareDayPanel, 80);
              setTimeout(prepareDayPanel, 300);
              setTimeout(prepareDayPanel, 800);
            }
          }, true);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            prepareDayPanel();
            watchDayButtons();
            setTimeout(prepareDayPanel, 600);
            setTimeout(prepareDayPanel, 1400);
          });
        } else {
          prepareDayPanel();
          watchDayButtons();
          setTimeout(prepareDayPanel, 600);
          setTimeout(prepareDayPanel, 1400);
        }

        window.addEventListener('resize', function() {
          setTimeout(prepareDayPanel, 100);
        });
      })();
    </script>


    <script>
      /* === Day1-6 白色行程面板：接管原本灰色把手拖曳 JS === */
      (function() {
        var startY = 0;
        var startSheetY = 0;
        var dragging = false;

        function app() {
          return document.querySelector('.app-container');
        }

        function panel() {
          return document.getElementById('sidePanel');
        }

        function handle() {
          return document.getElementById('dragHandle');
        }

        function isMobile() {
          return window.innerWidth <= 768;
        }

        function isDayMode() {
          var a = app();
          return isMobile() && a && !a.classList.contains('info-mode') && !document.body.classList.contains('info-mode');
        }

        function clamp(n, min, max) {
          return Math.max(min, Math.min(max, n));
        }

        function getCurrentY(p) {
          var value = getComputedStyle(p).getPropertyValue('--day-sheet-y').trim();
          if (value && value.indexOf('vh') > -1) {
            return window.innerHeight * parseFloat(value) / 100;
          }

          var transform = getComputedStyle(p).transform;
          if (transform && transform !== 'none') {
            var nums = transform.match(/matrix.*\((.+)\)/);
            if (nums && nums[1]) {
              var parts = nums[1].split(',');
              return parseFloat(parts[5] || 0) || 0;
            }
          }

          return window.innerHeight * 0.40;
        }

        function setY(p, yPx) {
          var minY = 0;
          var maxY = window.innerHeight * 0.58;
          var y = clamp(yPx, minY, maxY);
          p.style.setProperty('--day-sheet-y', y + 'px');
          p.style.transform = 'translateY(' + y + 'px)';
        }

        function snapY(p) {
          var current = getCurrentY(p);
          var vh = window.innerHeight;

          var top = 0;
          var mid = vh * 0.40;
          var low = vh * 0.58;

          var dTop = Math.abs(current - top);
          var dMid = Math.abs(current - mid);
          var dLow = Math.abs(current - low);

          var target = mid;
          if (dTop <= dMid && dTop <= dLow) target = top;
          else if (dLow <= dTop && dLow <= dMid) target = low;

          setY(p, target);
        }

        function prepare() {
          var p = panel();
          var h = handle();

          if (!p || !h || !isDayMode()) return;

          p.classList.add('day-sheet-takeover');
          p.classList.remove('full-info-panel');
          p.style.display = 'flex';
          p.style.visibility = 'visible';
          p.style.opacity = '1';

          if (!p.dataset.sheetReady) {
            setY(p, window.innerHeight * 0.40);
            p.dataset.sheetReady = '1';
          }

          bind();
        }

        function bind() {
          var h = handle();
          if (!h || h.dataset.sheetTakeoverBound === '1') return;
          h.dataset.sheetTakeoverBound = '1';

          function down(clientY, e) {
            if (!isDayMode()) return;

            var p = panel();
            if (!p) return;

            dragging = true;
            startY = clientY;
            startSheetY = getCurrentY(p);
            p.classList.add('day-sheet-dragging');

            if (e) {
              e.preventDefault();
              e.stopPropagation();
            }
          }

          function move(clientY, e) {
            if (!dragging) return;

            var p = panel();
            if (!p) return;

            var delta = clientY - startY;
            setY(p, startSheetY + delta);

            if (e) {
              e.preventDefault();
              e.stopPropagation();
            }
          }

          function up(e) {
            if (!dragging) return;

            var p = panel();
            if (!p) return;

            dragging = false;
            p.classList.remove('day-sheet-dragging');
            snapY(p);

            if (e) {
              e.preventDefault();
              e.stopPropagation();
            }
          }

          h.addEventListener('touchstart', function(e) {
            if (!e.touches || !e.touches[0]) return;
            down(e.touches[0].clientY, e);
          }, { passive: false });

          window.addEventListener('touchmove', function(e) {
            if (!e.touches || !e.touches[0]) return;
            move(e.touches[0].clientY, e);
          }, { passive: false });

          window.addEventListener('touchend', up, { passive: false });
          window.addEventListener('touchcancel', up, { passive: false });

          h.addEventListener('mousedown', function(e) {
            down(e.clientY, e);
          });

          window.addEventListener('mousemove', function(e) {
            move(e.clientY, e);
          });

          window.addEventListener('mouseup', up);
        }

        function watch() {
          document.addEventListener('click', function(e) {
            var target = e.target && e.target.closest ? e.target.closest('.nav-pill') : null;
            if (!target) return;
            if (/Day\s*[1-6]/i.test(target.textContent || '')) {
              setTimeout(function() {
                var p = panel();
                if (p && isDayMode()) {
                  p.dataset.sheetReady = '';
                }
                prepare();
              }, 120);
              setTimeout(prepare, 400);
              setTimeout(prepare, 900);
            }
          }, true);

          window.addEventListener('resize', function() {
            setTimeout(function() {
              var p = panel();
              if (p && isDayMode()) setY(p, window.innerHeight * 0.40);
              prepare();
            }, 120);
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            prepare();
            watch();
            setTimeout(prepare, 600);
            setTimeout(prepare, 1500);
          });
        } else {
          prepare();
          watch();
          setTimeout(prepare, 600);
          setTimeout(prepare, 1500);
        }
      })();
    </script>


    <script>
      /* === Day1-6 白色行程面板：整片白色區域都可拖曳 JS === */
      (function() {
        var dragging = false;
        var maybeDrag = false;
        var startY = 0;
        var startX = 0;
        var startSheetY = 0;
        var activePointerId = null;
        var hasMoved = false;

        function getApp() {
          return document.querySelector('.app-container');
        }

        function getPanel() {
          return document.getElementById('sidePanel');
        }

        function isMobile() {
          return window.innerWidth <= 768;
        }

        function isDayMode() {
          var app = getApp();
          return isMobile() && app && !app.classList.contains('info-mode') && !document.body.classList.contains('info-mode');
        }

        function clamp(n, min, max) {
          return Math.max(min, Math.min(max, n));
        }

        function getCurrentY(panel) {
          var styleValue = panel.style.getPropertyValue('--day-sheet-y').trim();
          if (styleValue) {
            if (styleValue.indexOf('vh') > -1) return window.innerHeight * parseFloat(styleValue) / 100;
            if (styleValue.indexOf('px') > -1) return parseFloat(styleValue);
          }

          var computedValue = getComputedStyle(panel).getPropertyValue('--day-sheet-y').trim();
          if (computedValue) {
            if (computedValue.indexOf('vh') > -1) return window.innerHeight * parseFloat(computedValue) / 100;
            if (computedValue.indexOf('px') > -1) return parseFloat(computedValue);
          }

          return window.innerHeight * 0.40;
        }

        function setY(panel, yPx) {
          var minY = 0;
          var maxY = window.innerHeight * 0.58;
          var y = clamp(yPx, minY, maxY);
          panel.style.setProperty('--day-sheet-y', y + 'px');
          panel.style.transform = 'translateY(' + y + 'px)';
        }

        function snap(panel) {
          var y = getCurrentY(panel);
          var vh = window.innerHeight;
          var top = 0;
          var mid = vh * 0.40;
          var low = vh * 0.58;

          var dTop = Math.abs(y - top);
          var dMid = Math.abs(y - mid);
          var dLow = Math.abs(y - low);

          var target = mid;
          if (dTop <= dMid && dTop <= dLow) target = top;
          else if (dLow <= dTop && dLow <= dMid) target = low;

          setY(panel, target);
        }

        function shouldIgnoreStart(target) {
          if (!target || !target.closest) return false;

          /* Day 行程卡本身還是可以點開 modal，所以互動元件不要拿來拖 */
          return !!target.closest('button, a, input, textarea, select, .place-time-btn, .modal-overlay, .leaflet-container');
        }

        function prepareAnywhereDrag() {
          var panel = getPanel();
          var content = document.getElementById('panelContent');
          var handle = document.getElementById('dragHandle');

          if (!panel || !content || !isDayMode()) return;

          panel.classList.add('day-anywhere-drag-panel');
          panel.classList.remove('full-info-panel');
          panel.style.display = 'flex';
          panel.style.visibility = 'visible';
          panel.style.opacity = '1';

          /* 移除前面版本插入的多餘灰點 */
          panel.querySelectorAll('.day-panel-handle, .day-real-drag-handle').forEach(function(el) {
            el.style.display = 'none';
          });

          if (handle && content && handle.nextSibling !== content) {
            panel.insertBefore(handle, content);
          }

          if (!panel.dataset.anywhereDragDefault) {
            setY(panel, window.innerHeight * 0.40);
            panel.dataset.anywhereDragDefault = '1';
          }

          bindPanel(panel);
        }

        function bindPanel(panel) {
          if (panel.dataset.anywhereDragBound === '1') return;
          panel.dataset.anywhereDragBound = '1';

          panel.addEventListener('pointerdown', function(e) {
            if (!isDayMode()) return;
            if (shouldIgnoreStart(e.target)) return;

            maybeDrag = true;
            dragging = false;
            hasMoved = false;
            activePointerId = e.pointerId;
            startX = e.clientX;
            startY = e.clientY;
            startSheetY = getCurrentY(panel);

            try {
              panel.setPointerCapture(e.pointerId);
            } catch (err) {}
          }, { passive: true });

          panel.addEventListener('pointermove', function(e) {
            if (!maybeDrag || activePointerId !== e.pointerId) return;

            var dx = e.clientX - startX;
            var dy = e.clientY - startY;

            if (!dragging) {
              if (Math.abs(dy) < 8 || Math.abs(dy) < Math.abs(dx)) return;
              dragging = true;
              hasMoved = true;
              panel.classList.add('day-anywhere-dragging');
            }

            setY(panel, startSheetY + dy);
            e.preventDefault();
          }, { passive: false });

          function end(e) {
            if (!maybeDrag || activePointerId !== e.pointerId) return;

            maybeDrag = false;

            if (dragging) {
              dragging = false;
              panel.classList.remove('day-anywhere-dragging');
              snap(panel);
              e.preventDefault();
            }

            activePointerId = null;

            try {
              panel.releasePointerCapture(e.pointerId);
            } catch (err) {}
          }

          panel.addEventListener('pointerup', end, { passive: false });
          panel.addEventListener('pointercancel', end, { passive: false });

          /* 避免拖曳後觸發卡片 click */
          panel.addEventListener('click', function(e) {
            if (hasMoved) {
              e.preventDefault();
              e.stopPropagation();
              hasMoved = false;
            }
          }, true);
        }

        function resetForDayClick() {
          var panel = getPanel();
          if (panel && isDayMode()) {
            panel.dataset.anywhereDragDefault = '';
            setY(panel, window.innerHeight * 0.40);
          }
          prepareAnywhereDrag();
        }

        document.addEventListener('click', function(e) {
          var btn = e.target && e.target.closest ? e.target.closest('.nav-pill') : null;
          if (!btn) return;

          if (/Day\s*[1-6]/i.test(btn.textContent || '')) {
            setTimeout(resetForDayClick, 120);
            setTimeout(prepareAnywhereDrag, 400);
            setTimeout(prepareAnywhereDrag, 900);
          }
        }, true);

        window.addEventListener('resize', function() {
          setTimeout(function() {
            var panel = getPanel();
            if (panel && isDayMode()) setY(panel, window.innerHeight * 0.40);
            prepareAnywhereDrag();
          }, 120);
        });

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            setTimeout(prepareAnywhereDrag, 300);
            setTimeout(prepareAnywhereDrag, 1000);
          });
        } else {
          setTimeout(prepareAnywhereDrag, 300);
          setTimeout(prepareAnywhereDrag, 1000);
        }
      })();
    </script>
